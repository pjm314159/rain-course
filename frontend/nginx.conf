# rain-course 前端网关（挂载为 /etc/nginx/conf.d/default.conf）
# 只监听 80：TLS 由前置反代终结（宝塔 / 云负载均衡 / 外层 nginx）。
# 如需本容器终结 TLS：在 docker-compose.yml 打开 443 端口并挂载证书卷，然后取消下方注释。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 二维码截图只在浏览器本地解码、不经服务器，此限制仅作兜底
    client_max_body_size 2m;

    # ---- 压缩 ----
    # nginx 默认只压 text/html，必须显式列出类型，否则 js/css 不会被压缩
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;
    # 构建期已生成 .gz（vite-plugin-compression2），存在时直出、省 CPU
    gzip_static on;

    # ---- 静态资源缓存 ----
    # Vite 产物带内容 hash → 长缓存 immutable；index.html 不缓存，保证发版即生效
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- REST 反代 ----
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 微信扫码登录是 30s 服务端长轮询，读超时必须大于它
        proxy_read_timeout 120s;
    }

    # ---- WebSocket 反代 ----
    location /ws {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 服务端 30s 一次心跳，读超时留足余量避免空闲误断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- SPA 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}

